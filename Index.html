  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'
};
function ic(name, size, sw) {
  size = size || 16;
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (sw || 1.9) +
    '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (IC[name] || '') + '</svg>';
}
function hydrateIcons(root) {
  var els = (root || document).querySelectorAll('[data-ic]');
  for (var i = 0; i < els.length; i++) {
    var s = Number(els[i].getAttribute('data-size')) || 16;
    els[i].innerHTML = ic(els[i].getAttribute('data-ic'), s);
  }
}

/* ============================================================
   UTIL & FORMAT
   ============================================================ */
var NF0 = new Intl.NumberFormat('id-ID');
var NF1 = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 1 });
function fmt(n) { return NF0.format(Number(n) || 0); }
function fmtPct(n) { return NF1.format(Number(n) || 0) + '%'; }
function bigPct(n) { return NF1.format(Number(n) || 0) + '<span class="unit">%</span>'; }
function round1(n) { return Math.round(n * 10) / 10; }

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function tone(p) {
  if (p >= 100) return { fg: '#047857', bg: '#e6f7ef', solid: '#10b981' };
  if (p >= 90) return { fg: '#0f766e', bg: '#e3f6f3', solid: '#14b8a6' };
  if (p >= 60) return { fg: '#b45309', bg: '#fef4e0', solid: '#f59e0b' };
  return { fg: '#be123c', bg: '#fdecef', solid: '#f43f5e' };
}
function colorFor(p) { return tone(p).solid; }
function pctPill(p) { var t = tone(p); return '<span class="pill-pct" style="color:' + t.fg + ';background:' + t.bg + '">' + fmtPct(p) + '</span>'; }

function initials(nama) {
  var s = String(nama || '').replace(/^(kabupaten|kota)\s+/i, '').trim();
  var parts = s.split(/\s+/).filter(Boolean);
  return ((parts[0] || '?').charAt(0) + (parts[1] ? parts[1].charAt(0) : '')).toUpperCase();
}

function findKab(kode) {
  return STATE.data.kabupaten.filter(function (k) { return k.kode === kode; })[0] || null;
}
function findKec(kab, row) {
  return kab ? (kab.kecamatan.filter(function (k) { return k.row === row; })[0] || null) : null;
}
function findKecByName(kab, nama) {
  return kab ? (kab.kecamatan.filter(function (k) { return k.nama === nama; })[0] || null) : null;
}
function currentSidebarFilter() {
  var el = document.getElementById('sidebar-search');
  return el ? el.value.toLowerCase() : '';
}
function sortedByKode(list) {
  return list.slice().sort(function (a, b) { return Number(a.kode) - Number(b.kode); });
}
function dkey(dt) {
  return dt.getFullYear() + '-' + ('0' + (dt.getMonth() + 1)).slice(-2) + '-' + ('0' + dt.getDate()).slice(-2);
}
function parseKey(k) { var p = k.split('-'); return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])); }
function timeAgo(ms, fallback) {
  if (!ms) return fallback || '';
  var s = (Date.now() - ms) / 1000;
  if (s < 60) return 'baru saja';
  if (s < 3600) return Math.floor(s / 60) + ' menit lalu';
  if (s < 86400) return Math.floor(s / 3600) + ' jam lalu';
  if (s < 7 * 86400) return Math.floor(s / 86400) + ' hari lalu';
  return fallback || '';
}

function setMain(html) {
  var m = document.getElementById('main');
  m.innerHTML = '<div class="container">' + html + '</div>';
}
function setCrumb(text) {
  document.getElementById('crumb-current').textContent = text;
}

function setBtnLoading(btn, loading) {
  if (!btn) return;
  btn.classList.toggle('loading', loading);
  btn.disabled = loading;
}
function btnHtml(id, label, onclick, cls) {
  return '<button class="btn ' + (cls || 'btn-primary') + '" id="' + id + '" onclick="' + onclick + '">' +
    '<span class="btn-label">' + label + '</span><span class="btn-spinner" aria-hidden="true"></span></button>';
}

/* Toast / notifikasi kartu */
function pushToast(o) {
  var stack = document.getElementById('toast-stack');
  var el = document.createElement('div');
  var icName = o.icon || (o.type === 'success' ? 'check' : o.type === 'error' ? 'alert' : 'bell');
  el.className = 'toast ' + (o.type || '') + (o.onClick ? ' clickable' : '');
  el.setAttribute('role', o.type === 'error' ? 'alert' : 'status');
  el.innerHTML = '<span class="toast-ic">' + ic(icName, 16) + '</span>' +
    '<div class="toast-body"><div class="toast-title">' + esc(o.title || '') + '</div>' +
    (o.msg ? '<div class="toast-msg">' + esc(o.msg) + '</div>' : '') + '</div>' +
    '<button class="toast-x" aria-label="Tutup">' + ic('x', 14) + '</button>';
  function close() {
    if (!el.parentNode) return;
    el.classList.add('out');
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 200);
  }
  el.querySelector('.toast-x').onclick = function (e) { e.stopPropagation(); close(); };
  if (o.onClick) el.onclick = function () { close(); o.onClick(); };
  stack.appendChild(el);
  while (stack.children.length > 4) stack.removeChild(stack.firstChild);
  setTimeout(close, o.duration || 4500);
}
function showToast(msg, type) {
  pushToast({ title: msg, type: type, duration: 4000 });
}
function actionError(err) {
  var msg = (err && err.message) || String(err);
  pushToast({ title: 'Gagal', msg: msg, type: 'error', duration: 6000 });
  if (/Sesi login sudah berakhir/.test(msg)) setTimeout(doLogout, 1500);
}

function readonlyBanner() {
  var d = STATE.data;
  if (!d || d.role === 'public' || d.editable) return '';
  return '<div class="readonly-banner"><span class="ni">' + ic('archive', 16) + '</span>' +
    '<span>Anda sedang melihat <b>arsip tahun ' + d.year + '</b>. Data hanya bisa dilihat, tidak bisa diubah.</span>' +
    '<button class="link-btn" onclick="onYearChange(' + d.latestYear + ')">Buka tahun ' + d.latestYear + ' ' + ic('arrow', 14) + '</button></div>';
}
function yearTag(y) {
  var d = STATE.data;
  return '<span class="year-tag' + (d && y !== d.latestYear ? ' archive' : '') + '">' + y + '</span>';
}
function pageHead(title, sub, actions) {
  return '<div class="page-head"><div><h1>' + title + '</h1>' + (sub ? '<p class="page-sub">' + sub + '</p>' : '') + '</div>' +
    (actions ? '<div class="page-actions">' + actions + '</div>' : '') + '</div>';
}
function card(title, sub, body, cls, right) {
  return '<section class="card ' + (cls || '') + '">' +
    (title ? '<div class="card-head"><div><h3>' + title + '</h3>' + (sub ? '<p>' + sub + '</p>' : '') + '</div>' + (right || '') + '</div>' : '') +
    '<div class="card-body">' + body + '</div></section>';
}
function sectionTitle(title, sub) {
  return '<div class="section-title"><h2>' + title + '</h2>' + (sub ? '<p>' + sub + '</p>' : '') + '</div>';
}
function emptyState(icon, title, text) {
  return '<div class="empty-state"><span class="ni">' + ic(icon, 22) + '</span><h3>' + title + '</h3><p>' + text + '</p></div>';
}

/* ============================================================
   AGREGASI DATA
   ============================================================ */
function aggregate(kabs) {
  var a = { total: 0, selesai: 0, proses: 0, belum: 0, rata: 0, kab: kabs.length };
  kabs.forEach(function (k) { a.total += k.totalKecamatan; a.selesai += k.selesai; a.proses += k.proses; a.belum += k.belumMulai; });
  a.rata = kabs.length ? Math.round((kabs.reduce(function (s, k) { return s + k.rataRata; }, 0) / kabs.length) * 100) / 100 : 0;
  return a;
}
function allKec(kabs) {
  var flat = [];
  kabs.forEach(function (kab) {
    kab.kecamatan.forEach(function (kec) {
      flat.push({ kabNama: kab.nama, kabKode: kab.kode, nama: kec.nama, progres: kec.progres, row: kec.row });
    });
  });
  return flat;
}
function hasAspek(kabs) {
  return kabs.some(function (k) { return k.kecamatan.some(function (c) { return !!c.aspek; }); });
}
function hasRiwayat(kabs) {
  return kabs.some(function (k) { return !!k.riwayat; });
}
function aspectStats(kabs) {
  var asp = STATE.data.aspects;
  var stats = asp.map(function (l) { return { label: l, done: 0, total: 0, pct: 0 }; });
  kabs.forEach(function (kab) {
    kab.kecamatan.forEach(function (kec) {
      (kec.aspek || []).forEach(function (a, i) { if (!stats[i]) return; stats[i].total++; if (a.filled) stats[i].done++; });
    });
  });
  stats.forEach(function (s) { s.pct = s.total ? round1(s.done / s.total * 100) : 0; });
  return stats;
}
function progressBins(kecs) {
  var bins = [
    { label: '0%', count: 0, color: '#f43f5e' },
    { label: '1–24%', count: 0, color: '#fb7185' },
    { label: '25–49%', count: 0, color: '#f59e0b' },
    { label: '50–74%', count: 0, color: '#fbbf24' },
    { label: '75–99%', count: 0, color: '#14b8a6' },
    { label: '100%', count: 0, color: '#10b981' }
  ];
  kecs.forEach(function (k) {
    var p = k.progres, i;
    if (p <= 0) i = 0; else if (p < 25) i = 1; else if (p < 50) i = 2; else if (p < 75) i = 3; else if (p < 100) i = 4; else i = 5;
    bins[i].count++;
  });
  return bins;
}
function activitySeries(kabs, days) {
  var counts = {};
  kabs.forEach(function (k) { (k.riwayat || []).forEach(function (r) { counts[r.tanggal] = (counts[r.tanggal] || 0) + 1; }); });
  var keys = Object.keys(counts).sort();
  var end;
  var d = STATE.data;
  if (d.year === d.latestYear) end = new Date();
  else end = keys.length ? parseKey(keys[keys.length - 1]) : new Date(d.year, 11, 31);
  var pts = [], total = 0, aktif = 0;
  for (var i = days - 1; i >= 0; i--) {
    var dt = new Date(end.getFullYear(), end.getMonth(), end.getDate() - i);
    var key = dkey(dt);
    var v = counts[key] || 0;
    total += v; if (v) aktif++;
    pts.push({ key: key, label: dt.getDate() + ' ' + BLN[dt.getMonth()], value: v });
  }
  var all = keys.reduce(function (s, k) { return s + counts[k]; }, 0);
  return { points: pts, total: total, aktifHari: aktif, all: all };
}

/* ============================================================
   CHARTS
   ============================================================ */
function gaugeChart(pct, foot) {
  var r = 70, C = 2 * Math.PI * r, t = tone(pct);
  var len = Math.max(0, Math.min(100, pct)) / 100 * C;
  var gid = 'gg' + (++UID);
  var arc = pct > 0
    ? '<circle cx="85" cy="85" r="' + r + '" fill="none" stroke="url(#' + gid + ')" stroke-width="14" stroke-linecap="round" stroke-dasharray="' + len.toFixed(2) + ' ' + C.toFixed(2) + '" transform="rotate(-90 85 85)"/>'
    : '';
  return '<div class="gauge"><div class="gauge-fig"><svg viewBox="0 0 170 170">' +
    '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + t.solid + '" stop-opacity=".75"/><stop offset="1" stop-color="' + t.solid + '"/></linearGradient></defs>' +
    '<circle cx="85" cy="85" r="' + r + '" fill="none" stroke="var(--line-2)" stroke-width="14"/>' + arc +
    '</svg><div class="gauge-center"><b>' + bigPct(pct) + '</b><span>rata-rata progres</span></div></div>' +
    (foot ? '<div class="gauge-foot">' + foot + '</div>' : '') + '</div>';
}

function donutChart(segs, centerVal, centerLbl) {
  var total = segs.reduce(function (s, x) { return s + x.value; }, 0);
  var r = 56, C = 2 * Math.PI * r, off = 0;
  var nz = segs.filter(function (s) { return s.value > 0; }).length;
  var arcs = '';
  segs.forEach(function (s) {
    if (!s.value || !total) return;
    var len = s.value / total * C;
    var gap = nz > 1 ? 2.5 : 0;
    var dl = Math.max(len - gap, 0.5);
    arcs += '<circle class="donut-seg" cx="75" cy="75" r="' + r + '" fill="none" stroke="' + s.color + '" stroke-width="18" ' +
      'stroke-dasharray="' + dl.toFixed(2) + ' ' + (C - dl).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 75 75)" ' +
      'data-tip="' + esc(s.label + ': ' + fmt(s.value) + ' (' + fmtPct(s.value / total * 100) + ')') + '"></circle>';
    off += len;
  });
  return '<div class="donut"><div class="donut-fig"><svg viewBox="0 0 150 150">' +
    '<circle cx="75" cy="75" r="' + r + '" fill="none" stroke="var(--line-2)" stroke-width="18"/>' + arcs +
    '</svg><div class="donut-center"><b>' + centerVal + '</b><span>' + centerLbl + '</span></div></div>' +
    '<ul class="legend">' + segs.map(function (s) {
      return '<li><i style="background:' + s.color + '"></i><span>' + esc(s.label) + '</span><b>' + fmt(s.value) + '</b><em>' +
        (total ? fmtPct(s.value / total * 100) : '0%') + '</em></li>';
    }).join('') + '</ul></div>';
}

function statusDonut(agg) {
  return donutChart([
    { label: 'Selesai', value: agg.selesai, color: CLR.ok },
    { label: 'Sedang proses', value: agg.proses, color: CLR.warn },
    { label: 'Belum mulai', value: agg.belum, color: CLR.bad }
  ], fmt(agg.total), 'kecamatan');
}

function columnChart(items, opts) {
  opts = opts || {};
  if (!items.length) return '<div class="chart-empty">Tidak ada data.</div>';
  var max = opts.max || Math.max.apply(null, items.map(function (i) { return i.value; }).concat([1]));
  return '<div class="colchart" style="--ch:' + (opts.height || 170) + 'px">' + items.map(function (it) {
    var h = max ? it.value / max * 100 : 0;
    if (it.value > 0) h = Math.max(h, 2.5);
    return '<div class="col" data-tip="' + esc(it.tip || '') + '"><span class="col-val">' + it.display + '</span>' +
      '<div class="col-track"><div class="col-fill" style="height:' + h.toFixed(1) + '%;background:' + it.color + '"></div></div>' +
      '<span class="col-lbl">' + esc(it.label) + '</span></div>';
  }).join('') + '</div>';
}

function aspectColumns(kabs) {
  var stats = aspectStats(kabs);
  return columnChart(stats.map(function (s) {
    return {
      label: SHORT_ASPEK[s.label] || s.label, value: s.pct, display: fmtPct(s.pct), color: colorFor(s.pct),
      tip: s.label + '\n' + fmt(s.done) + ' dari ' + fmt(s.total) + ' kecamatan (' + fmtPct(s.pct) + ')'
    };
  }), { max: 100, height: 180 });
}

function histogramChart(kecs) {
  var bins = progressBins(kecs);
  return columnChart(bins.map(function (b) {
    return { label: b.label, value: b.count, display: fmt(b.count), color: b.color, tip: 'Progres ' + b.label + ': ' + fmt(b.count) + ' kecamatan' };
  }), { height: 150 });
}

function niceStep(x) {
  if (x <= 1) return 1;
  var p = Math.pow(10, Math.floor(Math.log(x) / Math.LN10));
  var f = x / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
}

function areaChart(pts, unitLabel) {
  var W = 640, H = 210, pl = 34, pr = 12, pt = 12, pb = 28;
  var n = pts.length;
  if (!n) return '<div class="chart-empty">Tidak ada data.</div>';
  var maxV = Math.max.apply(null, pts.map(function (p) { return p.value; }).concat([0]));
  var step = niceStep(Math.max(maxV, 1) / 4), maxY = step * 4;
  function X(i) { return pl + (n > 1 ? i * (W - pl - pr) / (n - 1) : 0); }
  function Y(v) { return pt + (H - pt - pb) * (1 - v / maxY); }
  var gid = 'ag' + (++UID);
  var grid = '';
  for (var g = 0; g <= 4; g++) {
    var v = step * g, y = Y(v).toFixed(1);
    grid += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '" class="grid-line"/>' +
      '<text x="' + (pl - 8) + '" y="' + (Number(y) + 3.5) + '" class="axis-lbl" text-anchor="end">' + fmt(v) + '</text>';
  }
  var line = 'M' + X(0).toFixed(1) + ' ' + Y(pts[0].value).toFixed(1);
  for (var i = 1; i < n; i++) {
    var x0 = X(i - 1), y0 = Y(pts[i - 1].value), x1 = X(i), y1 = Y(pts[i].value), mx = (x0 + x1) / 2;
    line += ' C' + mx.toFixed(1) + ' ' + y0.toFixed(1) + ' ' + mx.toFixed(1) + ' ' + y1.toFixed(1) + ' ' + x1.toFixed(1) + ' ' + y1.toFixed(1);
  }
  var base = Y(0).toFixed(1);
  var area = line + ' L' + X(n - 1).toFixed(1) + ' ' + base + ' L' + X(0).toFixed(1) + ' ' + base + ' Z';
  var every = Math.ceil(n / 7), xl = '', dots = '', hits = '';
  var hw = n > 1 ? (W - pl - pr) / (n - 1) : 20;
  for (var j = 0; j < n; j++) {
    if (j % every === 0) xl += '<text x="' + X(j).toFixed(1) + '" y="' + (H - 8) + '" class="axis-lbl" text-anchor="middle">' + esc(pts[j].label) + '</text>';
    var tip = esc(pts[j].label + ': ' + fmt(pts[j].value) + ' ' + (unitLabel || ''));
    hits += '<rect class="area-hit" x="' + (X(j) - hw / 2).toFixed(1) + '" y="' + pt + '" width="' + hw.toFixed(1) + '" height="' + (H - pt - pb) + '" data-tip="' + tip + '"/>';
    if (pts[j].value > 0) dots += '<circle class="area-dot" cx="' + X(j).toFixed(1) + '" cy="' + Y(pts[j].value).toFixed(1) + '" r="3.2" fill="#fff" stroke="' + CLR.brand + '" stroke-width="2" pointer-events="none"/>';
  }
  return '<div class="area-chart"><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' +
    '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + CLR.brand + '" stop-opacity=".22"/><stop offset="1" stop-color="' + CLR.brand + '" stop-opacity="0"/></linearGradient></defs>' +
    grid + '<path d="' + area + '" fill="url(#' + gid + ')"/>' +
    '<path d="' + line + '" fill="none" stroke="' + CLR.brand + '" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>' +
    dots + hits + xl + '</svg></div>';
}

function activityCard(kabs, title) {
  var s = activitySeries(kabs, 30);
  var stats = '<div class="chart-stats">' +
    '<div class="chart-stat"><div class="v">' + fmt(s.total) + '</div><div class="l">aspek diperbarui (30 hari)</div></div>' +
    '<div class="chart-stat"><div class="v">' + fmt(s.aktifHari) + '<span class="unit">hari</span></div><div class="l">hari dengan aktivitas</div></div>' +
    '<div class="chart-stat"><div class="v">' + fmt(s.all) + '</div><div class="l">total tercatat ' + STATE.data.year + '</div></div>' +
    '</div>';
  var body = s.all ? stats + areaChart(s.points, 'aspek') : '<div class="chart-empty">Belum ada aktivitas yang tercatat tanggalnya.</div>';
  return card(title || 'Tren aktivitas', 'Jumlah aspek yang diperbarui per hari, 30 hari terakhir', body);
}

function rankBars(items, opts) {
  opts = opts || {};
  if (!items.length) return '<div class="chart-empty">Tidak ada data.</div>';
  return '<div class="bars' + (opts.twoCol ? ' two-col' : '') + '">' + items.map(function (it, i) {
    var clickable = !!it.onClickAttr;
    return '<div class="bar-row' + (opts.showRank ? '' : ' no-rank') + (clickable ? ' clickable' : '') + '"' + (clickable ? ' onclick="' + it.onClickAttr + '"' : '') +
      ' data-tip="' + esc(it.label + ': ' + fmtPct(it.pct)) + '">' +
      (opts.showRank ? '<span class="bar-rank">' + (i + 1) + '</span>' : '') +
      '<span class="bar-label">' + esc(it.label) + '</span>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + Math.max(it.pct, 1.5) + '%;background:' + colorFor(it.pct) + '"></div></div>' +
      '<span class="bar-val">' + pctPill(it.pct) + '</span></div>';
  }).join('') + '</div>';
}

function stackedBars(kabs) {
  var legend = '<div class="legend-inline" style="margin-bottom:12px;">' +
    '<span><i style="background:' + CLR.ok + '"></i>Selesai</span><span><i style="background:' + CLR.warn + '"></i>Proses</span><span><i style="background:' + CLR.bad + '"></i>Belum mulai</span></div>';
  var rows = kabs.slice().sort(function (a, b) { return (b.selesai / (b.totalKecamatan || 1)) - (a.selesai / (a.totalKecamatan || 1)) || b.rataRata - a.rataRata; }).map(function (k) {
    var t = k.totalKecamatan || 1;
    function seg(v, c, l) { return v ? '<i style="width:' + (v / t * 100).toFixed(2) + '%;background:' + c + '" data-tip="' + esc(k.nama + '\n' + l + ': ' + fmt(v) + ' kecamatan') + '"></i>' : ''; }
    return '<div class="stack-row" onclick="openKab(\'' + k.kode + '\')"><span class="stack-lbl">' + esc(k.nama) + '</span>' +
      '<div class="stack-track">' + seg(k.selesai, CLR.ok, 'Selesai') + seg(k.proses, CLR.warn, 'Proses') + seg(k.belumMulai, CLR.bad, 'Belum mulai') + '</div>' +
      '<span class="stack-val">' + fmt(k.totalKecamatan) + '</span></div>';
  }).join('');
  return legend + '<div class="bars">' + rows + '</div>';
}

function heatColor(p) {
  var a = [241, 245, 249], b = [29, 78, 216];
  var t = Math.max(0, Math.min(1, p / 100));
  return 'rgb(' + a.map(function (v, i) { return Math.round(v + (b[i] - v) * t); }).join(',') + ')';
}
function heatmap(kabs) {
  var asp = STATE.data.aspects;
  var h = '<div class="heat-wrap"><table class="heat"><thead><tr><th class="rowh">Kab/Kota</th>' +
    asp.map(function (a) { return '<th title="' + esc(a) + '">' + esc(SHORT_ASPEK[a] || a) + '</th>'; }).join('') + '<th>Rata-rata</th></tr></thead><tbody>';
  sortedByKode(kabs).forEach(function (kab) {
    var st = aspectStats([kab]);
    h += '<tr><td class="rowlabel" onclick="openKab(\'' + kab.kode + '\')" title="' + esc(kab.nama) + '">' + esc(kab.nama) + '</td>' +
      st.map(function (s) {
        return '<td class="cell" style="background:' + heatColor(s.pct) + ';color:' + (s.pct >= 55 ? '#fff' : 'var(--ink-2)') + '" data-tip="' +
          esc(kab.nama + '\n' + s.label + ': ' + fmt(s.done) + '/' + fmt(s.total) + ' (' + fmtPct(s.pct) + ')') + '">' + Math.round(s.pct) + '</td>';
      }).join('') +
      '<td style="background:transparent">' + pctPill(kab.rataRata) + '</td></tr>';
  });
  h += '</tbody></table></div><div class="heat-scale"><span>0%</span><i></i><span>100%</span><span style="margin-left:auto">Angka = % kecamatan yang sudah mengisi aspek</span></div>';
  return h;
}

function miniRing(p, size) {
  size = size || 60;
  var r = 23, C = 2 * Math.PI * r, t = tone(p);
  var arc = p > 0 ? '<circle cx="28" cy="28" r="' + r + '" fill="none" stroke="' + t.solid + '" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="' + (Math.min(p, 100) / 100 * C).toFixed(2) + ' ' + C.toFixed(2) + '" transform="rotate(-90 28 28)"/>' : '';
  return '<div class="mini-ring" style="width:' + size + 'px;height:' + size + 'px"><svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="' + r + '" fill="none" stroke="var(--line-2)" stroke-width="5.5"/>' + arc +
    '</svg><span>' + Math.round(p) + '<small>%</small></span></div>';
}

function kpi(o) {
  return '<div class="kpi"><div class="kpi-head"><span class="kpi-label">' + o.label + '</span>' +
    '<span class="kpi-ic" style="color:' + o.color + ';background:' + o.color + '1a">' + ic(o.icon, 16) + '</span></div>' +
    '<div class="kpi-value">' + o.value + '</div>' +
    (o.bar != null ? '<div class="kpi-bar"><i style="width:' + Math.min(100, Math.max(0, o.bar)) + '%;background:' + o.color + '"></i></div>' : '') +
    (o.sub ? '<div class="kpi-sub">' + o.sub + '</div>' : '') + '</div>';
}
function kpiRow(agg, withKab) {
  var tot = agg.total || 1;
  var h = '<div class="kpi-row">' +
    kpi({ label: 'Rata-rata progres', icon: 'target', color: CLR.brand, value: bigPct(agg.rata), bar: agg.rata, sub: 'Target 100% seluruh kecamatan' }) +
    kpi({ label: 'Kecamatan selesai', icon: 'check', color: CLR.ok, value: fmt(agg.selesai) + '<span class="unit">/ ' + fmt(agg.total) + '</span>', bar: agg.selesai / tot * 100, sub: fmtPct(agg.selesai / tot * 100) + ' dari total kecamatan' }) +
    kpi({ label: 'Sedang proses', icon: 'progress', color: CLR.warn, value: fmt(agg.proses), bar: agg.proses / tot * 100, sub: 'Sebagian aspek sudah terisi' }) +
    kpi({ label: 'Belum mulai', icon: 'flag', color: CLR.bad, value: fmt(agg.belum), bar: agg.belum / tot * 100, sub: 'Belum ada aspek terisi' });
  if (withKab) h += kpi({ label: 'Kabupaten/Kota', icon: 'map', color: CLR.indigo, value: fmt(agg.kab), sub: 'Wilayah yang dipantau' });
  return h + '</div>';
}

/* ============================================================
   INIT & LOAD
   ============================================================ */
function init() {
  try {
    var saved = sessionStorage.getItem('kda_auth');
    if (saved) STATE.auth = JSON.parse(saved);
  } catch (e) {}
  try { NOTIF.sound = localStorage.getItem('kda_sound') === '1'; } catch (e) {}
  hydrateIcons();
  setupGlobalListeners();
  loadData();
}

function setupGlobalListeners() {
  var tip = document.getElementById('tooltip');
  document.addEventListener('mouseover', function (e) {
    var t = e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
    var text = t ? t.getAttribute('data-tip') : '';
    if (text) { tip.textContent = text; tip.classList.add('show'); }
    else tip.classList.remove('show');
  });
  document.addEventListener('mousemove', function (e) {
    if (!tip.classList.contains('show')) return;
    var x = e.clientX + 14, y = e.clientY + 14;
    var w = tip.offsetWidth, h = tip.offsetHeight;
    if (x + w > window.innerWidth - 8) x = e.clientX - w - 14;
    if (y + h > window.innerHeight - 8) y = e.clientY - h - 14;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  });
  document.addEventListener('scroll', function () { tip.classList.remove('show'); }, true);
  document.addEventListener('click', function (e) {
    if (NOTIF.panelOpen && !(e.target.closest && e.target.closest('#bell-wrap'))) closeNotifPanel();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeNotifPanel(); toggleDrawer(false); }
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && NOTIF.timer) notifPoll();
  });
  document.getElementById('sidebar-search').oninput = function (e) { renderSidebar(e.target.value.toLowerCase()); };
}

function loadData() {
  setMain('<div class="loading">Memuat data...</div>');
  google.script.run.withSuccessHandler(onData).withFailureHandler(onError).getDashboardData(STATE.auth.token, STATE.year);
}

function onError(err) {
  var msg = (err && err.message) || String(err);
  setMain(emptyState('alert', 'Terjadi kesalahan', esc(msg)) +
    '<div style="text-align:center;margin-top:-40px;"><button class="btn btn-primary" onclick="doLogout()">Muat ulang</button></div>');
}

function onData(data) {
  STATE.data = data;
  STATE.year = data.year;
  if (!data.komentar) data.komentar = [];
  if (data.role === 'public' && STATE.auth.token) {
    // token di sessionStorage sudah kedaluwarsa
    STATE.auth = { token: null, role: 'public', kode: null, nama: null };
    try { sessionStorage.removeItem('kda_auth'); } catch (e) {}
  }
  applyLocalReads(data.komentar);
  renderYearSelect();

  if (data.needsSetup) {
    updateSidebarChrome();
    setMain(emptyState('info', 'Sheet data tahunan belum dibuat',
      'Jalankan menu <b>Dashboard KDA &gt; 1. Setup Sheet Tahun Awal</b> di Google Sheets, lalu muat ulang halaman ini.'));
    return;
  }

  updateSidebarChrome();

  // Notifikasi
  if (data.role !== 'public') {
    if (data.year === data.latestYear) notifIngest(data.komentar, data.year);
    notifStart(data.year !== data.latestYear);
  } else {
    notifStop();
  }

  var restore = STATE.restore;
  STATE.restore = null;

  if (restore && data.role !== 'public' && restoreView(restore)) {
    // tampilan sebelumnya dipulihkan
  } else if (data.role === 'kabkota' && data.kabupaten.length) {
    openKab(data.kabupaten[0].kode);
  } else if (data.role === 'admin' && STATE.pendingKab) {
    var target = STATE.pendingKab;
    STATE.pendingKab = null;
    openKab(target.kode, target.row);
  } else {
    showOverview();
  }
}

function restoreView(r) {
  switch (r.view) {
    case 'detail':
      var kab = r.kab ? findKab(r.kab) : null;
      if (!kab) return false;
      var kec = r.kecNama ? findKecByName(kab, r.kecNama) : null;
      openKab(r.kab, kec ? kec.row : null, r.focus);
      return true;
    case 'kelola': showKelola(r.kab); return true;
    case 'riwayat': showRiwayat(); return true;
    case 'filter': showFilter(); return true;
    case 'diskusi': showDiskusi(); return true;
    case 'overview': showOverview(); return true;
    default: return false;
  }
}

/* ===================== Tahun ===================== */
function renderYearSelect() {
  var d = STATE.data;
  var wrap = document.getElementById('year-switch');
  var sel = document.getElementById('year-select');
  if (!d.years || !d.years.length) { wrap.style.display = 'none'; return; }
  wrap.style.display = '';
  sel.innerHTML = d.years.slice().reverse().map(function (y) {
    var label = y + (y === d.latestYear ? ' · Aktif' : ' · Arsip');
    return '<option value="' + y + '"' + (y === d.year ? ' selected' : '') + '>' + label + '</option>';
  }).join('');
}

function onYearChange(y) {
  y = Number(y);
  if (!y || (STATE.data && y === STATE.data.year)) return;
  var kecNama = null;
  if (STATE.view === 'detail') {
    var kab = findKab(STATE.activeKab);
    var kec = findKec(kab, STATE.activeKecRow);
    kecNama = kec ? kec.nama : null;
  }
  STATE.restore = { view: STATE.view, kab: STATE.view === 'kelola' ? KELOLA_STATE.kode : STATE.activeKab, kecNama: kecNama };
  STATE.year = y;
  loadData();
}

/* ===================== Sidebar & drawer ===================== */
function toggleDrawer(open) {
  document.getElementById('sidebar').classList.toggle('open', !!open);
  document.getElementById('scrim').classList.toggle('show', !!open);
}

function updateSidebarChrome() {
  var d = STATE.data;
  var role = d.role;
  var loggedIn = role !== 'public';

  ['nav-filter', 'nav-riwayat', 'nav-diskusi', 'nav-kelola'].forEach(function (id) {
    document.getElementById(id).style.display = loggedIn && !d.needsSetup ? '' : 'none';
  });
  document.getElementById('nav-overview-label').textContent = role === 'kabkota' ? 'Ringkasan Wilayah' : 'Ringkasan Provinsi';
  var kabSection = document.getElementById('kab-section');
  kabSection.style.display = loggedIn && !d.needsSetup ? 'flex' : 'none';
  document.getElementById('side-spacer').style.display = loggedIn && !d.needsSetup ? 'none' : '';
  document.getElementById('side-search-wrap').style.display = role === 'admin' ? '' : 'none';
  document.getElementById('bell-wrap').style.display = loggedIn ? '' : 'none';
  document.getElementById('topbar-login').style.display = loggedIn ? 'none' : '';

  var footer = document.getElementById('sidebar-footer');
  if (!loggedIn) {
    footer.innerHTML = '<button class="btn btn-primary btn-block" onclick="showLogin()">' + ic('lock', 15) + ' Masuk</button>' +
      '<p class="side-note">Login untuk melihat detail kab/kota, mengisi checklist, dan berdiskusi.</p>';
  } else {
    var nama = role === 'admin' ? 'Admin Provinsi' : d.nama;
    footer.innerHTML = '<div class="user-card"><span class="avatar">' + esc(initials(nama)) + '</span>' +
      '<div class="user-meta"><div class="user-name" title="' + esc(nama) + '">' + esc(nama) + '</div>' +
      '<div class="user-role">' + (role === 'admin' ? 'Administrator' : 'Kab/Kota · ' + esc(d.kode)) + '</div></div>' +
      '<button class="icon-btn" onclick="doLogout()" title="Keluar" aria-label="Keluar">' + ic('logout', 17) + '</button></div>';
  }
  renderSidebar(currentSidebarFilter());
  updateNavBadge();
}

function getRankedKabupaten() {
  var sorted = STATE.data.kabupaten.slice().sort(function (a, b) { return b.rataRata - a.rataRata; });
  sorted.forEach(function (kab, i) { kab._rank = i + 1; });
  return sorted;
}

function renderSidebar(filterText) {
  var list = document.getElementById('kab-list');
  list.innerHTML = '';
  if (!STATE.data || STATE.data.role === 'public' || STATE.data.needsSetup) return;
  var showRank = STATE.data.role === 'admin';
  getRankedKabupaten().forEach(function (kab) {
    if (filterText && kab.nama.toLowerCase().indexOf(filterText) === -1) return;
    var unread = unreadOf(kab.kode, null);
    var li = document.createElement('li');
    li.className = (STATE.activeKab === kab.kode && STATE.view === 'detail') ? 'active' : '';
    li.innerHTML = (showRank ? '<span class="kab-rank-no">' + kab._rank + '</span>' : '') +
      '<span class="kab-name" title="' + esc(kab.nama) + '">' + esc(kab.nama) + '</span>' +
      (unread ? '<span class="kab-unread" title="' + unread + ' pesan belum dibaca"></span>' : '') +
      pctPill(kab.rataRata);
    li.onclick = function () { openKab(kab.kode); };
    list.appendChild(li);
  });
}

function setNav(which) {
  ['overview', 'filter', 'riwayat', 'diskusi', 'kelola'].forEach(function (n) {
    document.getElementById('nav-' + n).classList.toggle('active', which === n);
  });
  toggleDrawer(false);
  closeNotifPanel();
  var m = document.getElementById('main');
  if (m) m.scrollTop = 0;
}

/* ===================== Login ===================== */
function showLogin(hint) {
  STATE.view = 'login';
  setNav('');
  setCrumb('Masuk');
  var year = STATE.data ? STATE.data.year : '';
  setMain(
    '<div class="login-wrap"><div class="login-shell">' +
      '<div class="login-aside">' +
        '<div class="login-aside-badge">KDA ' + year + '</div>' +
        '<h2 class="login-aside-title">Portal Monitoring<br>Kecamatan Dalam Angka</h2>' +
        '<p class="login-aside-desc">Pantau dan perbarui progres penyusunan publikasi Kecamatan Dalam Angka di seluruh kabupaten/kota.</p>' +
        '<ul class="login-points">' +
          '<li><span class="ni">' + ic('check', 14, 2.4) + '</span>Checklist 10 aspek per kecamatan</li>' +
          '<li><span class="ni">' + ic('chat', 14, 2.2) + '</span>Diskusi & notifikasi provinsi – kab/kota</li>' +
          '<li><span class="ni">' + ic('archive', 14, 2.2) + '</span>Arsip data lintas tahun</li>' +
        '</ul>' +
        '<div class="login-aside-chart" aria-hidden="true">' + loginChartDecor() + '</div>' +
      '</div>' +
      '<div class="login-form">' +
        '<span class="login-eyebrow">Masuk ke Dashboard</span>' +
        '<h3 class="login-title">Login Wilayah</h3>' +
        '<p class="login-desc">' + esc(hint || 'Masukkan kode akses dan password untuk melihat detail dan mengisi checklist wilayah Anda.') + '</p>' +
        '<label class="login-label" for="login-code">Kode akses</label>' +
        '<div class="login-input-wrap"><span class="ni">' + ic('key', 16) + '</span>' +
          '<input id="login-code" type="text" placeholder="Contoh: 1801" autocomplete="username" autocapitalize="off" spellcheck="false"></div>' +
        '<label class="login-label" for="login-password">Password</label>' +
        '<div class="login-input-wrap"><span class="ni">' + ic('lock', 16) + '</span>' +
          '<input id="login-password" type="password" placeholder="Masukkan password" autocomplete="current-password">' +
          '<button type="button" id="pw-toggle-btn" class="pw-toggle" aria-label="Tampilkan password" onclick="togglePasswordVisibility()">' + ic('eye', 16) + '</button></div>' +
        btnHtml('login-submit', 'Masuk', 'doLogin()', 'btn-primary btn-lg btn-block') +
        '<div id="login-error" class="login-error" role="alert"></div>' +
        '<div class="login-hint"><b>Catatan:</b> Kode akses adalah 4 digit kode kabupaten/kota (mis. <code>1801</code>) atau kode khusus admin. Password diinformasikan oleh admin provinsi.</div>' +
      '</div>' +
    '</div></div>'
  );
  var codeInput = document.getElementById('login-code');
  var passInput = document.getElementById('login-password');
  codeInput.focus();
  function submitOnEnter(e) { if (e.key === 'Enter') doLogin(); }
  codeInput.addEventListener('keydown', submitOnEnter);
  passInput.addEventListener('keydown', submitOnEnter);
}

function loginChartDecor() {
  var hs = [18, 28, 22, 36, 30, 46, 40];
  var s = '<svg width="190" height="52" viewBox="0 0 190 52" fill="none">';
  hs.forEach(function (h, i) {
    s += '<rect x="' + (i * 27) + '" y="' + (52 - h) + '" width="17" height="' + h + '" rx="4" fill="' + (i === 5 ? 'rgba(147,197,253,0.75)' : 'rgba(255,255,255,' + (0.12 + i * 0.03) + ')') + '"/>';
  });
  return s + '</svg>';
}

function togglePasswordVisibility() {
  var input = document.getElementById('login-password');
  var btn = document.getElementById('pw-toggle-btn');
  if (!input || !btn) return;
  var showing = input.type === 'text';
  input.type = showing ? 'password' : 'text';
  btn.innerHTML = ic(showing ? 'eye' : 'eyeOff', 16);
  btn.setAttribute('aria-label', showing ? 'Tampilkan password' : 'Sembunyikan password');
}

function doLogin() {
  var codeInput = document.getElementById('login-code');
  var passInput = document.getElementById('login-password');
  var code = codeInput.value.trim();
  var password = passInput.value;
  var errBox = document.getElementById('login-error');
  var btn = document.getElementById('login-submit');

  errBox.textContent = '';
  errBox.classList.remove('show');
  if (!code) { errBox.textContent = 'Masukkan kode akses terlebih dahulu.'; errBox.classList.add('show'); codeInput.focus(); return; }
  if (!password) { errBox.textContent = 'Masukkan password terlebih dahulu.'; errBox.classList.add('show'); passInput.focus(); return; }

  setBtnLoading(btn, true);
  google.script.run
    .withSuccessHandler(function (res) {
      setBtnLoading(btn, false);
      if (!res.ok) {
        errBox.textContent = res.message || 'Kode atau password tidak dikenali.';
        errBox.classList.add('show');
        passInput.value = '';
        passInput.focus();
        return;
      }
      STATE.auth = { token: res.token, role: res.role, kode: res.kode, nama: res.nama };
      try { sessionStorage.setItem('kda_auth', JSON.stringify(STATE.auth)); } catch (e) {}
      notifReset();
      loadData();
    })
    .withFailureHandler(function (err) {
      setBtnLoading(btn, false);
      errBox.textContent = (err && err.message) || String(err);
      errBox.classList.add('show');
    })
    .login(code, password);
}

function doLogout() {
  var token = STATE.auth.token;
  STATE.auth = { token: null, role: 'public', kode: null, nama: null };
  STATE.pendingKab = null;
  STATE.restore = null;
  STATE.activeKab = null;
  notifStop();
  notifReset();
  try { sessionStorage.removeItem('kda_auth'); } catch (e) {}
  if (token) google.script.run.logout(token);
  loadData();
}

/* ===================== Ringkasan ===================== */
function showOverview() {
  STATE.view = 'overview';
  setNav('overview');
  renderSidebar(currentSidebarFilter());
  renderOverview(STATE.data.kabupaten);
}

function renderOverview(kabs) {
  var d = STATE.data;
  var isKab = d.role === 'kabkota';
  var agg = aggregate(kabs);
  var kecs = allKec(kabs);
  var multi = kabs.length > 1;
  setCrumb(isKab ? 'Ringkasan Wilayah' : 'Ringkasan Provinsi');

  var h = readonlyBanner();
  h += pageHead((isKab ? 'Ringkasan Wilayah' : 'Ringkasan Provinsi') + ' ' + yearTag(d.year),
    'Progres monitoring publikasi Kecamatan Dalam Angka ' + d.year + (isKab && kabs[0] ? ' — ' + esc(kabs[0].nama) : ' di seluruh kabupaten/kota'));

  h += kpiRow(agg, !isKab);

  var foot = '<span><b>' + fmt(agg.selesai) + '</b> selesai</span><span><b>' + fmt(agg.total - agg.selesai) + '</b> tersisa</span>';
  h += '<div class="grid g-3">' +
    card('Capaian keseluruhan', 'Rata-rata progres ' + (multi ? 'kab/kota' : 'kecamatan'), gaugeChart(agg.rata, foot)) +
    card('Status kecamatan', 'Komposisi berdasarkan progres', statusDonut(agg)) +
    card('Sebaran progres', 'Jumlah kecamatan per rentang progres', histogramChart(kecs)) +
    '</div>';

  var showAspek = hasAspek(kabs), showAct = hasRiwayat(kabs);
  if (showAspek || showAct) {
    h += '<div class="grid ' + (showAspek && showAct ? 'g-2' : '') + '">' +
      (showAspek ? card('Kelengkapan per aspek', 'Persentase kecamatan yang sudah mengisi tiap aspek', aspectColumns(kabs)) : '') +
      (showAct ? activityCard(kabs) : '') + '</div>';
  }

  if (d.role === 'admin' && multi) {
    h += '<div class="grid">' + card('Peta panas aspek × kab/kota', 'Temukan aspek yang tertinggal di setiap wilayah — klik nama untuk membuka rinciannya', heatmap(kabs)) + '</div>';
  }

  if (multi) {
    var rankItems = kabs.slice().sort(function (a, b) { return b.rataRata - a.rataRata; }).map(function (kab) {
      return { label: kab.nama, pct: kab.rataRata, onClickAttr: "openKab('" + kab.kode + "')" };
    });
    h += '<div class="grid g-2">' +
      card('Peringkat kab/kota', 'Diurutkan dari rata-rata progres tertinggi', rankBars(rankItems, { showRank: true })) +
      card('Komposisi status per kab/kota', 'Proporsi kecamatan selesai, proses, dan belum mulai', stackedBars(kabs)) +
      '</div>';
  }

  h += sectionTitle(multi ? 'Kabupaten/Kota' : 'Wilayah', 'Diurutkan dari progres terendah — prioritas pendampingan');
  h += '<div class="kab-grid">';
  kabs.slice().sort(function (a, b) { return a.rataRata - b.rataRata; }).forEach(function (kab) {
    var t = tone(kab.rataRata);
    var unread = d.role !== 'public' ? unreadOf(kab.kode, null) : 0;
    h += '<div class="kab-card" onclick="openKab(\'' + kab.kode + '\')">' +
      '<div class="kab-card-top"><div><div class="kab-card-name">' + esc(kab.nama) + '</div>' +
      '<div class="kab-card-code">' + esc(kab.kode) + ' · ' + fmt(kab.totalKecamatan) + ' kecamatan' + (unread ? ' · <span style="color:var(--bad-fg);font-weight:600">' + unread + ' pesan baru</span>' : '') + '</div></div>' +
      '<div class="kab-card-pct" style="color:' + t.fg + '">' + bigPct(kab.rataRata) + '</div></div>' +
      '<div class="progress"><i style="width:' + kab.rataRata + '%;background:' + t.solid + '"></i></div>' +
      '<div class="kab-card-foot"><span><i class="dot" style="background:' + CLR.ok + '"></i>' + fmt(kab.selesai) + ' selesai</span>' +
      '<span><i class="dot" style="background:' + CLR.warn + '"></i>' + fmt(kab.proses) + ' proses</span>' +
      '<span><i class="dot" style="background:' + CLR.bad + '"></i>' + fmt(kab.belumMulai) + ' belum</span></div></div>';
  });
  h += '</div>';

  var asc = kecs.slice().sort(function (a, b) { return a.progres - b.progres; });
  var top10 = asc.slice(-10).reverse();
  var bottom10 = asc.slice(0, 10);
  h += sectionTitle('Peringkat Kecamatan', '10 kecamatan dengan progres tertinggi dan terendah');
  h += '<div class="grid g-2">' +
    card('Progres tertinggi', null, rankList(top10, multi, true)) +
    card('Progres terendah', null, rankList(bottom10, multi, false)) + '</div>';

  if (multi) {
    h += sectionTitle('Peringkat per Kab/Kota', '5 kecamatan tertinggi dan terendah di masing-masing wilayah');
    h += '<div class="kab-rank-list">';
    sortedByKode(kabs).forEach(function (kab) {
      var ks = kab.kecamatan.slice().sort(function (a, b) { return b.progres - a.progres; });
      var w = withKab(kab);
      h += '<details class="kab-rank-item"><summary><span class="chev">' + ic('chevron', 14) + '</span>' + esc(kab.nama) + pctPill(kab.rataRata) + '</summary>' +
        '<div class="kab-rank-body"><div><div class="sub-label">Tertinggi</div>' + rankList(ks.slice(0, 5).map(w), false, true) + '</div>' +
        '<div><div class="sub-label">Terendah</div>' + rankList(ks.slice(-5).reverse().map(w), false, false) + '</div></div></details>';
    });
    h += '</div>';
  }

  setMain(h);
}

function withKab(kab) {
  return function (kec) { return { kabNama: kab.nama, kabKode: kab.kode, nama: kec.nama, progres: kec.progres, row: kec.row }; };
}

function rankList(items, showKab, medal) {
  if (!items.length) return '<div class="chart-empty">Tidak ada data.</div>';
  return '<div class="rank-list">' + items.map(function (it, i) {
    return '<div class="rank-item" onclick="openKab(\'' + it.kabKode + '\',' + it.row + ')">' +
      '<span class="rank-no' + (medal ? ' top' : '') + '">' + (i + 1) + '</span>' +
      '<span class="rank-name">' + esc(it.nama) + (showKab ? '<small>' + esc(it.kabNama) + '</small>' : '') + '</span>' +
      pctPill(it.progres) + '</div>';
  }).join('') + '</div>';
}

/* ===================== Cari Kecamatan ===================== */
function showFilter() {
  if (STATE.data.role === 'public') { showLogin(); return; }
  STATE.view = 'filter';
  FILTER_STATE.kode = null;
  setNav('filter');
  setCrumb('Cari Kecamatan');
  renderSidebar(currentSidebarFilter());

  var isKabkota = STATE.data.role === 'kabkota';
  var h = readonlyBanner();
  if (isKabkota) {
    var namaWilayah = STATE.data.kabupaten.length ? STATE.data.kabupaten[0].nama : STATE.data.nama;
    h += pageHead('Cari Kecamatan', 'Cari dan pantau kecamatan di wilayah ' + esc(namaWilayah));
  } else {
    h += pageHead('Cari Kecamatan', 'Pilih kabupaten/kota terlebih dahulu, lalu cari kecamatan di dalamnya');
    h += '<div class="filter-bar"><select id="filter-kab-select" onchange="onFilterKabChange(this.value)"><option value="">Pilih Kabupaten/Kota</option>' +
      sortedByKode(STATE.data.kabupaten).map(function (kab) { return '<option value="' + kab.kode + '">' + esc(kab.nama) + '</option>'; }).join('') +
      '</select></div>';
  }
  h += '<div id="filter-insight"></div>';
  h += '<div id="filter-kec-search-box" class="filter-bar" style="display:none;"><input id="kec-search" placeholder="Cari nama kecamatan..." oninput="runFilter(this.value)"></div>';
  h += '<div id="filter-results"></div>';
  setMain(h);
  if (!isKabkota) {
    document.getElementById('filter-results').innerHTML = emptyState('search', 'Pilih kabupaten/kota', 'Statistik dan daftar kecamatan akan muncul setelah Anda memilih wilayah.');
  }
  if (isKabkota && STATE.data.kabupaten.length) onFilterKabChange(STATE.data.kabupaten[0].kode);
}

function onFilterKabChange(kode) {
  FILTER_STATE.kode = kode || null;
  var insightBox = document.getElementById('filter-insight');
  var searchBox = document.getElementById('filter-kec-search-box');
  var resultsBox = document.getElementById('filter-results');
  if (!kode) { insightBox.innerHTML = ''; searchBox.style.display = 'none'; resultsBox.innerHTML = ''; return; }
  var kab = findKab(kode);
  if (!kab) return;

  var stats = aspectStats([kab]).sort(function (a, b) { return a.pct - b.pct; });
  var h = kpiRow(aggregate([kab]), false);
  h += '<div class="grid g-2">' +
    card('Aspek paling tertinggal', esc(kab.nama), '<div class="hbars">' + stats.slice(0, 5).map(function (s) {
      var t = tone(s.pct);
      return '<div class="hbar"><div class="hbar-top"><span>' + esc(s.label) + '</span><b>' + fmtPct(s.pct) + '<em>' + fmt(s.done) + '/' + fmt(s.total) + '</em></b></div>' +
        '<div class="progress sm"><i style="width:' + s.pct + '%;background:' + t.solid + '"></i></div></div>';
    }).join('') + '</div>') +
    card('Status kecamatan', 'Komposisi berdasarkan progres', statusDonut(aggregate([kab]))) +
    '</div>';
  insightBox.innerHTML = h;
  searchBox.style.display = 'flex';
  document.getElementById('kec-search').value = '';
  runFilter('');
}

function runFilter(q) {
  var box = document.getElementById('filter-results');
  if (!FILTER_STATE.kode) { box.innerHTML = ''; return; }
  var kab = findKab(FILTER_STATE.kode);
  if (!kab) { box.innerHTML = ''; return; }
  q = (q || '').toLowerCase().trim();
  var list = kab.kecamatan
    .filter(function (kec) { return !q || kec.nama.toLowerCase().indexOf(q) !== -1; })
    .slice().sort(function (a, b) { return a.progres - b.progres; });
  if (!list.length) { box.innerHTML = emptyState('search', 'Tidak ditemukan', 'Tidak ada kecamatan yang cocok dengan pencarian.'); return; }

  box.innerHTML = '<div class="card list-card">' + list.map(function (kec) {
    var unread = unreadOf(kab.kode, kec.nama);
    var t = tone(kec.progres);
    return '<div class="list-row" onclick="openKab(\'' + kab.kode + '\',' + kec.row + ')">' +
      '<div class="lr-main"><div class="lr-title">' + esc(kec.nama) + (unread ? '<span class="pill red">' + unread + ' pesan baru</span>' : '') + '</div>' +
      '<div class="lr-desc">' + (kec.missing.length ? 'Kurang: ' + esc(kec.missing.join(', ')) : 'Semua aspek lengkap') + '</div></div>' +
      '<div class="lr-side"><div class="pct" style="color:' + t.fg + '">' + fmtPct(kec.progres) + '</div>' +
      '<div class="progress sm"><i style="width:' + kec.progres + '%;background:' + t.solid + '"></i></div></div></div>';
  }).join('') + '</div>';
}

function onRiwayatKabChange(kode) {
