}

function renderRiwayatBody() {
  var body = document.getElementById('riwayat-body');
  if (!body) return;
  var isKabkota = STATE.data.role === 'kabkota';
  var showKabName = !isKabkota && RIWAYAT_STATE.kode === 'all';
  var kabSources = STATE.data.kabupaten;
  if (!isKabkota && RIWAYAT_STATE.kode !== 'all') kabSources = kabSources.filter(function (k) { return k.kode === RIWAYAT_STATE.kode; });

  var chartBox = document.getElementById('riwayat-chart');
  if (chartBox) chartBox.innerHTML = '<div class="grid">' + activityCard(kabSources) + '</div>';

  var entries = [];
  kabSources.forEach(function (kab) {
    (kab.riwayat || []).forEach(function (r) {
      entries.push({ tanggal: r.tanggal, tanggalDisplay: r.tanggalDisplay, jam: r.jam, kecamatan: r.kecamatan, kecamatanRow: r.kecamatanRow, aspek: r.aspek, kabNama: kab.nama, kabKode: kab.kode });
    });
  });
  var searchInput = document.getElementById('riwayat-search');
  var q = searchInput ? searchInput.value.toLowerCase().trim() : '';
  if (q) entries = entries.filter(function (e) { return e.kecamatan.toLowerCase().indexOf(q) !== -1 || (showKabName && e.kabNama.toLowerCase().indexOf(q) !== -1); });
  entries.sort(function (a, b) {
    if (a.tanggal !== b.tanggal) return a.tanggal < b.tanggal ? 1 : -1;
    return (b.jam || '').localeCompare(a.jam || '');
  });

  if (!entries.length) {
    body.innerHTML = emptyState('clock', 'Belum ada riwayat', 'Belum ada aspek yang tercatat tanggal pengerjaannya' + (q ? ' untuk pencarian ini' : '') + '.');
    return;
  }

  var groups = [], gi = {};
  entries.forEach(function (e) {
    if (!(e.tanggal in gi)) { gi[e.tanggal] = groups.length; groups.push({ tanggalDisplay: e.tanggalDisplay, kec: [], ki: {} }); }
    var g = groups[gi[e.tanggal]];
    var key = e.kabKode + '|' + e.kecamatanRow;
    if (!(key in g.ki)) { g.ki[key] = g.kec.length; g.kec.push({ kecamatan: e.kecamatan, row: e.kecamatanRow, kabNama: e.kabNama, kabKode: e.kabKode, aspek: [] }); }
    g.kec[g.ki[key]].aspek.push({ aspek: e.aspek, jam: e.jam });
  });

  var h = sectionTitle('Linimasa', fmt(entries.length) + ' pembaruan tercatat');
  groups.forEach(function (g) {
    var total = g.kec.reduce(function (s, k) { return s + k.aspek.length; }, 0);
    h += '<div class="tl-group"><div class="tl-date"><h4>' + esc(g.tanggalDisplay) + '</h4><span>' + fmt(total) + ' aspek · ' + fmt(g.kec.length) + ' kecamatan</span></div><div class="tl-list">';
    g.kec.forEach(function (k) {
      var jam = k.aspek.filter(function (a) { return a.jam; }).map(function (a) { return a.jam; })[0] || '';
      h += '<div class="tl-item" onclick="openKab(\'' + k.kabKode + '\',' + k.row + ')"><div class="tl-head">' +
        '<span class="tl-name">' + esc(k.kecamatan) + (showKabName ? ' <span>· ' + esc(k.kabNama) + '</span>' : '') + '</span>' +
        '<span class="tl-jam">' + esc(jam) + '</span></div><div class="tl-tags">' +
        k.aspek.map(function (a) { return '<span class="pill">' + esc(a.aspek) + '</span>'; }).join('') + '</div></div>';
    });
    h += '</div></div>';
  });
  body.innerHTML = h;
}

/* ===================== Detail Kab/Kota ===================== */
function openKab(kode, kecRow, focusDiskusi) {
  if (STATE.data.role === 'public') {
    STATE.pendingKab = { kode: kode, row: kecRow || null };
    showLogin('Login diperlukan untuk melihat detail dan checklist kabupaten/kota ini.');
    return;
  }
  var kab = findKab(kode);
  if (!kab) return;
  var sameKab = STATE.view === 'detail' && STATE.activeKab === kode;
  STATE.view = 'detail';
  STATE.activeKab = kode;
  if (!sameKab || kecRow || focusDiskusi) STATE.detailTab = 'checklist';
  setNav('');
  renderSidebar(currentSidebarFilter());
  STATE.activeKecRow = (kecRow && findKec(kab, kecRow)) ? kecRow : (sameKab && findKec(kab, STATE.activeKecRow) ? STATE.activeKecRow : (kab.kecamatan[0] ? kab.kecamatan[0].row : null));
  renderKabDetail(kab);
  if (focusDiskusi) {
    setTimeout(function () {
      var el = document.getElementById('diskusi');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 60);
  }
}

function renderKabDetail(kab) {
  var d = STATE.data;
  saveDraft();
  setCrumb(kab.nama);
  var actions = d.editable ? '<button class="btn" onclick="showKelola(\'' + kab.kode + '\')">' + ic('kelola', 15) + ' Tambah Kecamatan</button>' : '';
  var h = readonlyBanner() +
    pageHead(esc(kab.nama) + ' ' + yearTag(d.year), 'Kode ' + esc(kab.kode) + ' · ' + fmt(kab.totalKecamatan) + ' kecamatan · ' + fmt(kab.selesai) + ' selesai', actions);
  h += kpiRow(aggregate([kab]), false);
  h += '<div class="segmented" role="tablist">' +
    '<button class="' + (STATE.detailTab === 'checklist' ? 'active' : '') + '" onclick="setDetailTab(\'checklist\')">' + ic('list', 15) + ' Checklist</button>' +
    '<button class="' + (STATE.detailTab === 'analitik' ? 'active' : '') + '" onclick="setDetailTab(\'analitik\')">' + ic('chart', 15) + ' Analitik</button></div>';
  h += '<div id="detail-body"></div>';
  setMain(h);
  renderDetailBody(kab);
}

function setDetailTab(tab) {
  STATE.detailTab = tab;
  var kab = findKab(STATE.activeKab);
  if (kab) renderKabDetail(kab);
}

function renderDetailBody(kab) {
  var box = document.getElementById('detail-body');
  if (!box) return;
  if (STATE.detailTab === 'analitik') {
    var agg = aggregate([kab]);
    var bars = kab.kecamatan.slice().sort(function (a, b) { return b.progres - a.progres; }).map(function (kec) {
      return { label: kec.nama, pct: kec.progres, onClickAttr: "selectKec('" + kab.kode + "'," + kec.row + ",true)" };
    });
    var h = '<div class="grid g-12">' +
      card('Status kecamatan', 'Komposisi berdasarkan progres', statusDonut(agg)) +
      card('Kelengkapan per aspek', 'Persentase kecamatan yang sudah mengisi tiap aspek', aspectColumns([kab])) + '</div>';
    h += '<div class="grid g-21">' + activityCard([kab]) +
      card('Sebaran progres', 'Jumlah kecamatan per rentang', histogramChart(kab.kecamatan)) + '</div>';
    h += '<div class="grid">' + card('Progres per kecamatan', 'Klik salah satu untuk membuka checklistnya', rankBars(bars, { showRank: true, twoCol: bars.length > 8 })) + '</div>';
    box.innerHTML = h;
    return;
  }

  var nav = '<aside class="card kec-nav"><div class="kec-nav-head"><h3>Kecamatan <span>' + fmt(kab.kecamatan.length) + '</span></h3>' +
    '<input id="kec-nav-search" placeholder="Cari kecamatan..." oninput="filterKecNav(this.value)"></div><div class="kec-nav-list" id="kec-nav-list">' +
    kab.kecamatan.map(function (kec) {
      var t = tone(kec.progres);
      var unread = unreadOf(kab.kode, kec.nama);
      return '<div class="kec-item' + (kec.row === STATE.activeKecRow ? ' active' : '') + '" id="kecitem-' + kec.row + '" data-nama="' + esc(kec.nama.toLowerCase()) + '" onclick="selectKec(\'' + kab.kode + '\',' + kec.row + ')">' +
        '<div class="kec-item-top"><span class="kec-item-name" title="' + esc(kec.nama) + '">' + esc(kec.nama) + '</span>' +
        '<span class="kec-badge" id="kecbadge-' + kec.row + '" style="' + (unread ? '' : 'display:none') + '" title="Pesan belum dibaca">' + (unread || '') + '</span>' +
        '<span class="kec-item-pct" style="color:' + t.fg + '">' + fmtPct(kec.progres) + '</span></div>' +
        '<div class="progress sm"><i style="width:' + kec.progres + '%;background:' + t.solid + '"></i></div></div>';
    }).join('') + '</div></aside>';
  box.innerHTML = '<div class="detail-layout">' + nav + '<div id="kec-panel"></div></div>';
  renderKecPanel(kab);
  var act = document.getElementById('kecitem-' + STATE.activeKecRow);
  if (act && act.scrollIntoView) {
    var list = document.getElementById('kec-nav-list');
    if (list) list.scrollTop = Math.max(0, act.offsetTop - list.offsetTop - 60);
  }
}

function filterKecNav(q) {
  q = (q || '').toLowerCase().trim();
  var items = document.querySelectorAll('#kec-nav-list .kec-item');
  for (var i = 0; i < items.length; i++) {
    items[i].style.display = !q || items[i].getAttribute('data-nama').indexOf(q) !== -1 ? '' : 'none';
  }
}

function selectKec(kode, row, fromChart) {
  var kab = findKab(kode);
  if (!kab) return;
  saveDraft();
  STATE.activeKecRow = row;
  if (fromChart || STATE.detailTab !== 'checklist' || !document.getElementById('kec-panel')) {
    STATE.detailTab = 'checklist';
    renderKabDetail(kab);
  } else {
    var items = document.querySelectorAll('#kec-nav-list .kec-item');
    for (var i = 0; i < items.length; i++) items[i].classList.toggle('active', items[i].id === 'kecitem-' + row);
    renderKecPanel(kab);
  }
  if (window.innerWidth <= 900) {
    var p = document.getElementById('kec-panel');
    if (p) p.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

/* Draft komentar dipertahankan saat panel dirender ulang */
function saveDraft() {
  var ta = document.getElementById('komentar-isi');
  var sel = document.getElementById('komentar-aspek');
  if (ta && STATE.activeKab) STATE.draft = { key: STATE.activeKab + '|' + STATE.activeKecRow, isi: ta.value, aspek: sel ? sel.value : '' };
}
function restoreDraft() {
  var dr = STATE.draft;
  if (!dr || dr.key !== STATE.activeKab + '|' + STATE.activeKecRow) return;
  var ta = document.getElementById('komentar-isi');
  var sel = document.getElementById('komentar-aspek');
  if (ta) ta.value = dr.isi;
  if (sel) sel.value = dr.aspek;
}

function renderKecPanel(kab) {
  var kec = findKec(kab, STATE.activeKecRow);
  var panel = document.getElementById('kec-panel');
  if (!panel) return;
  if (!kec) { panel.innerHTML = card(null, null, emptyState('info', 'Belum ada kecamatan', 'Tambahkan kecamatan melalui menu Kelola Data.')); return; }

  var editable = STATE.data.editable;
  var kecKomentar = komentarOf(kab.kode, kec.nama);
  var filled = kec.aspek.filter(function (a) { return a.filled; }).length;

  var h = '<section class="card kec-card"><div class="kec-head"><div><div class="eyebrow">Checklist publikasi</div><h3>' + esc(kec.namaLengkap) + '</h3>' +
    '<p>' + fmt(filled) + ' dari ' + fmt(kec.aspek.length) + ' aspek terisi</p></div>' + miniRing(kec.progres, 64) + '</div>';
  h += '<div class="seg-bar">' + kec.aspek.map(function (a) { return '<i class="' + (a.filled ? 'on' : '') + '" data-tip="' + esc(a.label + (a.filled ? ' — selesai' : ' — belum')) + '"></i>'; }).join('') + '</div>';

  h += '<div class="aspek-grid">';
  kec.aspek.forEach(function (a, idx) {
    var openCmt = kecKomentar.filter(function (c) { return c.aspek === a.label && c.status !== 'Selesai'; }).length;
    var cmtBtn = '<button type="button" class="aspek-cmt' + (openCmt ? ' has' : '') + '" title="' + (openCmt ? openCmt + ' komentar terbuka untuk aspek ini' : 'Komentari aspek ini') + '" ' +
      'onclick="event.preventDefault();event.stopPropagation();komentariAspek(' + idx + ')">' + ic('chat', 14) + (openCmt ? openCmt : '') + '</button>';
    var no = '<span class="aspek-no">' + ('0' + (idx + 1)).slice(-2) + '</span>';
    if (a.isDate) {
      h += '<div class="aspek-item aspek-date readonly' + (a.filled ? ' done' : '') + '">' +
        '<div class="aspek-date-row">' + no + '<span class="aspek-text"><span class="lbl">' + esc(a.label) + '</span>' +
        (a.filled ? '<span class="date">' + esc(a.value) + '</span>' : '<span class="date">Isi tanggal</span>') + '</span>' + cmtBtn + '</div>' +
        '<input type="date" class="aspek-date-input" value="' + esc(a.rawDate || '') + '" ' +
        (editable ? 'onchange="setTanggal(\'' + kab.sheetName + '\',' + kec.row + ',' + idx + ',this.value)"' : 'disabled') + '></div>';
    } else {
      h += '<label class="aspek-item' + (a.filled ? ' done' : '') + (editable ? '' : ' readonly') + '">' + no +
        '<input type="checkbox" ' + (a.filled ? 'checked ' : '') + (editable ? 'onchange="toggle(\'' + kab.sheetName + '\',' + kec.row + ',' + idx + ',this.checked)"' : 'disabled') + '>' +
        '<span class="aspek-text"><span class="lbl">' + esc(a.label) + '</span>' + (a.filled ? '<span class="date">' + esc(a.value) + '</span>' : '') + '</span>' +
        cmtBtn + '</label>';
    }
  });
  h += '</div>';

  if (kec.missing.length) {
    h += '<div class="missing-box"><span class="ni">' + ic('alert', 16) + '</span><span><b>Belum lengkap (' + kec.missing.length + '):</b> ' + esc(kec.missing.join(', ')) + '</span></div>';
  } else {
    h += '<div class="missing-box empty"><span class="ni">' + ic('check', 16, 2.4) + '</span><span><b>Lengkap</b> — semua aspek sudah terisi.</span></div>';
  }

  h += renderDiskusiSection(kab, kec, kecKomentar);
  h += '</section>';
  panel.innerHTML = h;
  restoreDraft();

  var list = panel.querySelector('.komentar-list');
  if (list) list.scrollTop = list.scrollHeight;
  markReadIfNeeded(kab, kec);
}

function toggle(sheetName, row, aspectIndex, checked) {
  google.script.run.withSuccessHandler(onKabUpdated).withFailureHandler(function (err) {
    actionError(err);
    var kab = findKab(STATE.activeKab);
    if (kab) renderKabDetail(kab);
  }).toggleAspek(STATE.auth.token, sheetName, row, aspectIndex, checked);
}

function setTanggal(sheetName, row, aspectIndex, value) {
  google.script.run.withSuccessHandler(onKabUpdated).withFailureHandler(function (err) {
    actionError(err);
    var kab = findKab(STATE.activeKab);
    if (kab) renderKabDetail(kab);
  }).setAspekTanggal(STATE.auth.token, sheetName, row, aspectIndex, value);
}

function replaceKab(updatedKab) {
  var list = STATE.data.kabupaten;
  for (var i = 0; i < list.length; i++) {
    if (list[i].kode === updatedKab.kode) { list[i] = updatedKab; return; }
  }
  list.push(updatedKab);
}

function onKabUpdated(updatedKab) {
  replaceKab(updatedKab);
  renderSidebar(currentSidebarFilter());
  if (STATE.view === 'detail' && STATE.activeKab === updatedKab.kode) {
    var navList = document.getElementById('kec-nav-list');
    var navScroll = navList ? navList.scrollTop : 0;
    renderKabDetail(updatedKab);
    navList = document.getElementById('kec-nav-list');
    if (navList) navList.scrollTop = navScroll;
  }
}

/* ===================== Komentar / Diskusi ===================== */
function myReadKey() { return STATE.data.role === 'admin' ? 'dibacaAdmin' : 'dibacaKab'; }
function isUnread(c) { return STATE.data && STATE.data.role !== 'public' && !c[myReadKey()]; }
function komentarOf(kode, kecNama) {
  return (STATE.data.komentar || []).filter(function (c) { return c.kode === kode && (kecNama == null || c.kecamatan === kecNama); });
}
function unreadOf(kode, kecNama) { return komentarOf(kode, kecNama).filter(isUnread).length; }

function updateNavBadge() {
  var badge = document.getElementById('nav-diskusi-badge');
  if (!badge || !STATE.data) return;
  var n = (STATE.data.komentar || []).filter(isUnread).length;
  badge.textContent = n ? String(n) : '';
}

function renderDiskusiSection(kab, kec, list) {
  var d = STATE.data;
  var h = '<div class="diskusi" id="diskusi"><div class="diskusi-head"><h4>' + ic('chat', 16) + ' Diskusi Kecamatan</h4>' +
    '<span class="diskusi-count" id="diskusi-count">' + diskusiCountText(list) + '</span></div>' +
    '<div id="komentar-list-wrap">' + komentarListHtml(list) + '</div>';
  if (d.editable) {
    h += '<div class="komentar-form">' +
      '<textarea id="komentar-isi" maxlength="1000" placeholder="Tulis komentar untuk ' + (d.role === 'admin' ? esc(kab.nama) : 'admin provinsi') + ' terkait ' + esc(kec.nama) + '..."></textarea>' +
      '<div class="komentar-form-row"><select id="komentar-aspek" class="field-select" aria-label="Rujukan komentar">' +
        '<option value="">Rujukan: kecamatan (umum)</option>' +
        d.aspects.map(function (a) { return '<option value="' + esc(a) + '">Rujukan aspek: ' + esc(a) + '</option>'; }).join('') +
      '</select>' + btnHtml('komentar-kirim', ic('arrow', 15) + ' Kirim', "kirimKomentar('" + kab.kode + "'," + kec.row + ")") + '</div></div>';
  } else {
    h += '<div class="diskusi-note">Diskusi tahun arsip hanya bisa dibaca.</div>';
  }
  return h + '</div>';
}

function diskusiCountText(list) {
  var open = list.filter(function (c) { return c.status !== 'Selesai'; }).length;
  return fmt(list.length) + ' komentar · ' + fmt(open) + ' terbuka';
}

function komentarListHtml(list) {
  var d = STATE.data;
  if (!list.length) {
    return '<div class="diskusi-empty">Belum ada komentar untuk kecamatan ini' +
      (d.editable ? '. Tulis catatan untuk ' + (d.role === 'admin' ? 'kab/kota' : 'admin provinsi') + ' di bawah.' : '.') + '</div>';
  }
  return '<div class="komentar-list">' + list.map(function (c) { return renderKomentarItem(c, d.editable); }).join('') + '</div>';
}

function renderKomentarItem(c, editable) {
  var mine = c.pengirimRole === STATE.data.role;
  var selesai = c.status === 'Selesai';
  var fresh = NOTIF.freshIds[c.id];
  return '<div class="komentar' + (mine ? ' mine' : '') + (selesai ? ' resolved' : '') + (fresh ? ' fresh' : '') + '">' +
    '<div class="komentar-meta"><b>' + esc(c.pengirimNama) + '</b>' +
      '<span class="role-tag ' + (c.pengirimRole === 'admin' ? 'admin' : 'kabkota') + '">' + (c.pengirimRole === 'admin' ? 'Provinsi' : 'Kab/Kota') + '</span>' +
      '<span title="' + esc(c.waktuDisplay) + '">' + esc(timeAgo(c.waktuMs, c.waktuDisplay)) + '</span>' +
      (isUnread(c) ? '<span class="new-tag">Baru</span>' : '') + '</div>' +
    (c.aspek ? '<span class="komentar-aspek">Aspek: ' + esc(c.aspek) + '</span>' : '<span class="komentar-aspek umum">Kecamatan (umum)</span>') +
    '<div class="komentar-isi">' + esc(c.isi).replace(/\n/g, '<br>') + '</div>' +
    '<div class="komentar-foot">' +
      (selesai ? '<span class="status-tag done">' + ic('check', 13, 2.4) + 'Selesai' + (c.diselesaikanOleh ? ' · ' + esc(c.diselesaikanOleh) : '') + '</span>'
               : '<span class="status-tag open"><i class="dot" style="background:' + CLR.warn + '"></i>Terbuka</span>') +
      (editable ? '<button class="link-btn" onclick="ubahStatusKomentar(\'' + esc(c.id) + '\',' + (!selesai) + ')">' + (selesai ? 'Buka lagi' : 'Tandai selesai') + '</button>' : '') +
    '</div></div>';
}

function komentariAspek(idx) {
  var sel = document.getElementById('komentar-aspek');
  var ta = document.getElementById('komentar-isi');
  var box = document.getElementById('diskusi');
  if (sel) sel.value = STATE.data.aspects[idx];
  if (box) box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  if (ta) setTimeout(function () { ta.focus(); }, 250);
}

function markReadIfNeeded(kab, kec) {
  if (STATE.data.role === 'public') return;
  var unread = komentarOf(kab.kode, kec.nama).filter(isUnread);
  if (!unread.length) return;
  var key = myReadKey();
  unread.forEach(function (c) { c[key] = true; NOTIF.localRead[c.id] = true; });
  // sinkronkan juga daftar notifikasi (bisa berupa array berbeda)
  NOTIF.komentar.forEach(function (c) { if (NOTIF.localRead[c.id]) c[key] = true; });
  updateNavBadge();
  renderBell();
  renderSidebar(currentSidebarFilter());
  var b = document.getElementById('kecbadge-' + kec.row);
  if (b) { b.textContent = ''; b.style.display = 'none'; }
  google.script.run.withFailureHandler(function () {})
    .tandaiKomentarDibaca(STATE.auth.token, STATE.data.year, kab.kode, kec.nama);
}

function kirimKomentar(kode, row) {
  var kab = findKab(kode);
  var kec = findKec(kab, row);
  if (!kec) return;
  var ta = document.getElementById('komentar-isi');
  var sel = document.getElementById('komentar-aspek');
  var btn = document.getElementById('komentar-kirim');
  var isi = ta.value.trim();
  if (!isi) { showToast('Tulis komentar terlebih dahulu.', 'error'); ta.focus(); return; }
  setBtnLoading(btn, true);
  google.script.run
    .withSuccessHandler(function (list) {
      STATE.data.komentar = list;
      if (STATE.data.year === NOTIF.year || STATE.data.year === STATE.data.latestYear) notifIngest(list, STATE.data.year);
      STATE.draft = null;
      if (STATE.view === 'detail' && STATE.activeKab === kode && STATE.activeKecRow === row) {
        var t = document.getElementById('komentar-isi');
        if (t) t.value = '';
        renderKecPanel(kab);
      }
      updateNavBadge();
      showToast('Komentar terkirim.', 'success');
    })
    .withFailureHandler(function (err) { setBtnLoading(btn, false); actionError(err); })
    .tambahKomentar(STATE.auth.token, STATE.data.year, kode, kec.nama, sel.value, isi);
}

function ubahStatusKomentar(id, selesai) {
  google.script.run
    .withSuccessHandler(function (list) {
      STATE.data.komentar = list;
      if (STATE.data.year === NOTIF.year) notifIngest(list, NOTIF.year);
      refreshKomentarViews();
      showToast(selesai ? 'Komentar ditandai selesai.' : 'Komentar dibuka kembali.', 'success');
    })
    .withFailureHandler(actionError)
    .setStatusKomentar(STATE.auth.token, id, selesai);
}

/** Perbarui bagian tampilan yang memuat komentar tanpa merender ulang seluruh halaman. */
function refreshKomentarViews() {
  updateNavBadge();
  renderSidebar(currentSidebarFilter());
  if (STATE.view === 'detail') {
    var kab = findKab(STATE.activeKab);
    if (!kab) return;
    kab.kecamatan.forEach(function (k) {
      var b = document.getElementById('kecbadge-' + k.row);
      if (!b) return;
      var n = unreadOf(kab.kode, k.nama);
      b.textContent = n ? String(n) : '';
      b.style.display = n ? '' : 'none';
    });
    var kec = findKec(kab, STATE.activeKecRow);
    var wrap = document.getElementById('komentar-list-wrap');
    if (kec && wrap) {
      var list = komentarOf(kab.kode, kec.nama);
      wrap.innerHTML = komentarListHtml(list);
      var cnt = document.getElementById('diskusi-count');
      if (cnt) cnt.textContent = diskusiCountText(list);
      var l = wrap.querySelector('.komentar-list');
      if (l) l.scrollTop = l.scrollHeight;
      markReadIfNeeded(kab, kec);
    }
  } else if (STATE.view === 'diskusi') {
    renderDiskusiBody();
  } else if (STATE.view === 'filter' && FILTER_STATE.kode) {
    var q = document.getElementById('kec-search');
    runFilter(q ? q.value : '');
  }
}

/* Halaman Diskusi */
function showDiskusi() {
  if (STATE.data.role === 'public') { showLogin(); return; }
  STATE.view = 'diskusi';
  setNav('diskusi');
  setCrumb('Diskusi');
  renderSidebar(currentSidebarFilter());
  var d = STATE.data;
  var isAdmin = d.role === 'admin';
  if (!isAdmin) DISKUSI_STATE.kode = 'all';

  var h = readonlyBanner() + pageHead('Diskusi ' + yearTag(d.year), isAdmin
    ? 'Semua percakapan dengan kab/kota per kecamatan. Klik salah satu untuk membuka checklist dan membalas.'
    : 'Percakapan dengan admin provinsi per kecamatan di wilayah Anda. Klik salah satu untuk membuka checklist dan membalas.');
  h += '<div class="filter-bar">';
  if (isAdmin) {
    h += '<select id="diskusi-kab" onchange="DISKUSI_STATE.kode=this.value;renderDiskusiBody()"><option value="all">Semua Kab/Kota</option>' +
      sortedByKode(d.kabupaten).map(function (kab) { return '<option value="' + kab.kode + '"' + (DISKUSI_STATE.kode === kab.kode ? ' selected' : '') + '>' + esc(kab.nama) + '</option>'; }).join('') + '</select>';
  }
  h += '<select id="diskusi-status" onchange="DISKUSI_STATE.status=this.value;renderDiskusiBody()">' +
    [['all', 'Semua percakapan'], ['unread', 'Ada pesan belum dibaca'], ['open', 'Masih ada yang terbuka'], ['done', 'Semua sudah selesai']]
      .map(function (o) { return '<option value="' + o[0] + '"' + (DISKUSI_STATE.status === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') +
    '</select><input id="diskusi-search" placeholder="Cari kecamatan..." oninput="renderDiskusiBody()"></div>';
  h += '<div id="diskusi-body"></div>';
  setMain(h);
  renderDiskusiBody();
}

function renderDiskusiBody() {
  var body = document.getElementById('diskusi-body');
  if (!body) return;
  var d = STATE.data;
  var isAdmin = d.role === 'admin';
  var searchEl = document.getElementById('diskusi-search');
  var q = searchEl ? searchEl.value.toLowerCase().trim() : '';

  var threads = [], idx = {};
  (d.komentar || []).forEach(function (c) {
    if (isAdmin && DISKUSI_STATE.kode !== 'all' && c.kode !== DISKUSI_STATE.kode) return;
    var key = c.kode + '|' + c.kecamatan;
    if (!(key in idx)) { idx[key] = threads.length; threads.push({ kode: c.kode, namaKab: c.namaKab, kecamatan: c.kecamatan, items: [] }); }
    threads[idx[key]].items.push(c);
  });
  threads.forEach(function (t) {
    t.items.sort(function (a, b) { return a.waktuMs - b.waktuMs; });
    t.last = t.items[t.items.length - 1];
    t.unread = t.items.filter(isUnread).length;
    t.open = t.items.filter(function (c) { return c.status !== 'Selesai'; }).length;
  });
  threads = threads.filter(function (t) {
    if (q && t.kecamatan.toLowerCase().indexOf(q) === -1 && t.namaKab.toLowerCase().indexOf(q) === -1) return false;
    if (DISKUSI_STATE.status === 'unread') return t.unread > 0;
    if (DISKUSI_STATE.status === 'open') return t.open > 0;
    if (DISKUSI_STATE.status === 'done') return t.open === 0;
    return true;
  }).sort(function (a, b) {
    if ((b.unread > 0) !== (a.unread > 0)) return b.unread > 0 ? 1 : -1;
    return b.last.waktuMs - a.last.waktuMs;
  });

  if (!threads.length) {
    body.innerHTML = emptyState('chat', 'Belum ada diskusi', (d.komentar || []).length
      ? 'Tidak ada percakapan yang cocok dengan filter ini.'
      : 'Buka checklist salah satu kecamatan, lalu tulis komentar di bagian Diskusi Kecamatan.');
    return;
  }

  body.innerHTML = '<div class="card list-card">' + threads.map(function (t) {
    var kab = findKab(t.kode);
    var kec = kab ? findKecByName(kab, t.kecamatan) : null;
    var onclick = kab ? ' onclick="openKab(\'' + t.kode + '\',' + (kec ? kec.row : 'null') + ',true)"' : '';
    var aspekSet = {};
    t.items.forEach(function (c) { if (c.aspek && c.status !== 'Selesai') aspekSet[c.aspek] = true; });
    return '<div class="list-row thread-item' + (t.unread ? ' unread' : '') + '"' + onclick + '>' +
      '<span class="avatar' + (t.last.pengirimRole === 'admin' ? '' : '') + '" style="' + (t.last.pengirimRole === 'admin' ? 'background:linear-gradient(135deg,#0f172a,#334155)' : '') + '">' + esc(initials(t.last.pengirimNama)) + '</span>' +
      '<div class="lr-main"><div class="lr-title">' + esc(t.kecamatan) + (isAdmin ? '<span class="sub">· ' + esc(t.namaKab) + '</span>' : '') + '</div>' +
      '<div class="lr-desc"><b style="color:var(--ink-2);font-weight:600">' + esc(t.last.pengirimNama) + ':</b> ' + esc(t.last.isi.replace(/\s+/g, ' ')) + '</div>' +
      '<div class="thread-tags"><span class="pill gray">' + fmt(t.items.length) + ' komentar</span>' +
        (t.unread ? '<span class="pill red">' + fmt(t.unread) + ' belum dibaca</span>' : '') +
        (t.open ? '<span class="pill yellow">' + fmt(t.open) + ' terbuka</span>' : '<span class="pill green">Semua selesai</span>') +
        Object.keys(aspekSet).map(function (a) { return '<span class="pill">' + esc(a) + '</span>'; }).join('') + '</div></div>' +
      '<span class="thread-time" title="' + esc(t.last.waktuDisplay) + '">' + esc(timeAgo(t.last.waktuMs, t.last.waktuDisplay)) + '</span></div>';
  }).join('') + '</div>';
}

/* ============================================================
   NOTIFIKASI PESAN
   ============================================================ */
function notifReset() {
  NOTIF.komentar = []; NOTIF.year = null; NOTIF.seen = {}; NOTIF.localRead = {};
  NOTIF.ready = false; NOTIF.freshIds = {}; NOTIF.busy = false;
  closeNotifPanel();
  renderBell();
}

function notifStart(pollNow) {
  if (!NOTIF.timer) {
    NOTIF.timer = setInterval(function () { if (!document.hidden) notifPoll(); }, POLL_MS);
  }
  if (pollNow) notifPoll();
}

function notifStop() {
  if (NOTIF.timer) clearInterval(NOTIF.timer);
  NOTIF.timer = null;
}

function applyLocalReads(list) {
  if (!list || !STATE.data || STATE.data.role === 'public') return;
  var key = myReadKey();
  list.forEach(function (c) { if (NOTIF.localRead[c.id]) c[key] = true; });
}

function notifPoll() {
  var token = STATE.auth.token;
  if (!token || NOTIF.busy) return;
  NOTIF.busy = true;
  google.script.run
    .withSuccessHandler(function (res) {
      NOTIF.busy = false;
      if (token !== STATE.auth.token) return;
      if (!res || !res.ok) {
        if (res && res.expired) {
          notifStop();
          pushToast({ title: 'Sesi login berakhir', msg: 'Silakan login ulang.', type: 'error' });
          setTimeout(doLogout, 1500);
        }
        return;
      }
      if (!res.year) return;
      applyLocalReads(res.komentar);
      if (STATE.data && res.year === STATE.data.year) {
        STATE.data.komentar = res.komentar;
        notifIngest(res.komentar, res.year);
        refreshKomentarViews();
      } else {
        notifIngest(res.komentar, res.year);
      }
    })
    .withFailureHandler(function () { NOTIF.busy = false; })
    .getNotifikasi(token);
}

function notifIngest(list, year) {
  NOTIF.year = year;
  NOTIF.komentar = list || [];
  var fresh = [];
  NOTIF.komentar.forEach(function (c) {
    if (!NOTIF.seen[c.id]) {
      NOTIF.seen[c.id] = true;
      if (NOTIF.ready && isUnread(c)) fresh.push(c);
    }
  });
  var unread = NOTIF.komentar.filter(isUnread);

  if (!NOTIF.ready) {
    NOTIF.ready = true;
    if (unread.length) {
      pushToast({
        title: 'Ada ' + unread.length + ' pesan belum dibaca',
        msg: 'Klik untuk melihat daftar pesan terbaru.',
        icon: 'bell', duration: 7000, onClick: openNotifPanel
      });
    }
  } else if (fresh.length) {
    fresh.forEach(function (c) { NOTIF.freshIds[c.id] = true; });
    fresh.slice(-3).forEach(function (c) {
      pushToast({
        title: 'Pesan baru dari ' + c.pengirimNama,
        msg: c.kecamatan + (c.aspek ? ' · ' + c.aspek : '') + ' — ' + c.isi.replace(/\s+/g, ' ').slice(0, 90),
        icon: 'chat', duration: 8000,
        onClick: (function (id) { return function () { openFromNotif(id); }; })(c.id)
      });
    });
    if (fresh.length > 3) pushToast({ title: '+' + (fresh.length - 3) + ' pesan baru lainnya', icon: 'bell', onClick: openNotifPanel });
    playPing();
    var bell = document.getElementById('bell-btn');
    if (bell) { bell.classList.remove('ring'); void bell.offsetWidth; bell.classList.add('ring'); }
  }
  renderBell();
}

function renderBell() {
  var badge = document.getElementById('bell-badge');
  if (!badge) return;
  var n = STATE.data && STATE.data.role !== 'public' ? NOTIF.komentar.filter(isUnread).length : 0;
  badge.textContent = n ? (n > 99 ? '99+' : String(n)) : '';
  var btn = document.getElementById('bell-btn');
  if (btn) btn.setAttribute('aria-label', n ? n + ' pesan belum dibaca' : 'Notifikasi pesan');
  if (NOTIF.panelOpen) renderNotifPanel();
}

function toggleNotifPanel() {
  if (NOTIF.panelOpen) closeNotifPanel(); else openNotifPanel();
}
function openNotifPanel() {
  if (!STATE.data || STATE.data.role === 'public') return;
  NOTIF.panelOpen = true;
  document.getElementById('notif-panel').classList.add('open');
  document.getElementById('bell-btn').classList.add('open');
  renderNotifPanel();
  if (!NOTIF.busy) notifPoll();
}
function closeNotifPanel() {
  NOTIF.panelOpen = false;
  var p = document.getElementById('notif-panel');
  if (p) p.classList.remove('open');
  var b = document.getElementById('bell-btn');
  if (b) b.classList.remove('open');
}

function renderNotifPanel() {
  var panel = document.getElementById('notif-panel');
  if (!panel || !STATE.data) return;
  var role = STATE.data.role;
  var incoming = NOTIF.komentar.filter(function (c) { return c.pengirimRole !== role; })
    .sort(function (a, b) { return b.waktuMs - a.waktuMs; });
  var unread = incoming.filter(isUnread);
  var shown = unread.concat(incoming.filter(function (c) { return !isUnread(c); })).slice(0, 12);

  var h = '<div class="np-head"><h4>Notifikasi</h4><div class="np-head-actions">' +
    '<button class="icon-btn" onclick="toggleSound()" title="' + (NOTIF.sound ? 'Matikan suara notifikasi' : 'Aktifkan suara notifikasi') + '" aria-label="Suara notifikasi">' + ic(NOTIF.sound ? 'volume' : 'volumeOff', 16) + '</button>' +
    (unread.length ? '<button class="link-btn" onclick="tandaiSemuaDibacaUI()">' + ic('checkAll', 15) + ' Tandai dibaca</button>' : '') +
    '</div></div><div class="np-sub">' + (unread.length ? fmt(unread.length) + ' pesan belum dibaca' : 'Semua pesan sudah dibaca') +
    (NOTIF.year ? ' · tahun ' + NOTIF.year : '') + ' · diperbarui otomatis</div>';
  h += '<div class="np-body">';
  if (!shown.length) {
    h += '<div class="np-empty"><span class="ni">' + ic('bell', 20) + '</span><div>Belum ada pesan masuk.</div></div>';
  } else {
    shown.forEach(function (c) {
      var u = isUnread(c);
      h += '<div class="np-item' + (u ? ' unread' : '') + '" onclick="openFromNotif(\'' + esc(c.id) + '\')">' +
        '<span class="avatar' + (c.pengirimRole === 'admin' ? ' admin' : '') + '">' + esc(initials(c.pengirimNama)) + '</span>' +
        '<div class="np-text"><div class="np-title"><b>' + esc(c.pengirimNama) + '</b> di <b>' + esc(c.kecamatan) + '</b>' +
        (role === 'admin' ? ' <span class="muted">· ' + esc(c.namaKab) + '</span>' : '') + '</div>' +
        '<div class="np-snippet">' + (c.aspek ? '[' + esc(c.aspek) + '] ' : '') + esc(c.isi.replace(/\s+/g, ' ')) + '</div>' +
        '<div class="np-time">' + esc(timeAgo(c.waktuMs, c.waktuDisplay)) + '</div></div></div>';
    });
  }
  h += '</div><div class="np-foot"><button class="btn btn-block" onclick="closeNotifPanel();goDiskusiLatest()">Lihat semua diskusi ' + ic('arrow', 14) + '</button></div>';
  panel.innerHTML = h;
}

function goDiskusiLatest() {
  if (STATE.data.year !== NOTIF.year && NOTIF.year) {
    STATE.year = NOTIF.year;
    STATE.restore = { view: 'diskusi' };
    loadData();
    return;
  }
  showDiskusi();
}

function openFromNotif(id) {
  var c = NOTIF.komentar.filter(function (x) { return x.id === id; })[0];
  closeNotifPanel();
  if (!c) return;
  if (STATE.data.year !== NOTIF.year) {
    STATE.year = NOTIF.year;
    STATE.restore = { view: 'detail', kab: c.kode, kecNama: c.kecamatan, focus: true };
    loadData();
    return;
  }
  var kab = findKab(c.kode);
  if (!kab) return;
  var kec = findKecByName(kab, c.kecamatan);
  openKab(c.kode, kec ? kec.row : null, true);
}

function tandaiSemuaDibacaUI() {
  var key = myReadKey();
  NOTIF.komentar.forEach(function (c) { c[key] = true; NOTIF.localRead[c.id] = true; });
  if (STATE.data.year === NOTIF.year) applyLocalReads(STATE.data.komentar);
  renderBell();
  refreshKomentarViews();
  google.script.run
    .withSuccessHandler(function () { showToast('Semua pesan ditandai sudah dibaca.', 'success'); })
    .withFailureHandler(actionError)
    .tandaiSemuaKomentarDibaca(STATE.auth.token);
}

function toggleSound() {
  NOTIF.sound = !NOTIF.sound;
  try { localStorage.setItem('kda_sound', NOTIF.sound ? '1' : '0'); } catch (e) {}
  if (NOTIF.sound) playPing(true);
  renderNotifPanel();
  showToast(NOTIF.sound ? 'Suara notifikasi diaktifkan.' : 'Suara notifikasi dimatikan.', 'success');
}

function playPing(force) {
  if (!NOTIF.sound && !force) return;
  try {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    NOTIF.ctx = NOTIF.ctx || new Ctx();
    var ctx = NOTIF.ctx;
    if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
    [0, 0.14].forEach(function (delay, i) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      var t0 = ctx.currentTime + delay;
      o.type = 'sine';
      o.frequency.setValueAtTime(i ? 1175 : 880, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.32);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0 + 0.34);
    });
  } catch (e) {}
}

/* ============================================================
   KELOLA DATA
   ============================================================ */
function showKelola(presetKode) {
  if (STATE.data.role === 'public') { showLogin(); return; }
  var d = STATE.data;
  var isAdmin = d.role === 'admin';
  STATE.view = 'kelola';
  setNav('kelola');
  setCrumb('Kelola Data');
  renderSidebar(currentSidebarFilter());

  if (!isAdmin) KELOLA_STATE.kode = d.kode;
  else if (presetKode !== undefined) KELOLA_STATE.kode = presetKode || null;
  if (KELOLA_STATE.kode && !findKab(KELOLA_STATE.kode)) KELOLA_STATE.kode = null;
  KELOLA_STATE.baruRow = null;

  var h = readonlyBanner() + pageHead('Kelola Data', isAdmin ? 'Tambah tahun data baru dan kecamatan baru untuk kab/kota' : 'Tambah kecamatan baru untuk wilayah ' + esc(d.nama));

  // Kartu Tahun
  var tahun = '<p class="desc">Hanya tahun terbaru yang bisa diedit. Tahun sebelumnya tersimpan sebagai arsip dan hanya bisa dilihat. Klik tahun untuk membukanya.</p><div class="year-chips">';
  d.years.slice().reverse().forEach(function (y) {
    var aktif = y === d.latestYear;
    tahun += '<div class="year-chip' + (aktif ? ' aktif' : '') + (y === d.year ? ' current' : '') + '" onclick="onYearChange(' + y + ')"><b>' + y + '</b>' +
      '<span>' + (aktif ? '<i class="dot" style="background:' + CLR.ok + '"></i>Aktif · bisa diedit' : ic('archive', 12) + ' Arsip · hanya lihat') + '</span></div>';
  });
  tahun += '</div>';
  if (isAdmin) {
    var next = d.latestYear + 1;
    tahun += '<p class="desc">Menambah tahun <b>' + next + '</b> akan menyalin semua sheet kab/kota tahun ' + d.latestYear +
      ' (termasuk kecamatan yang baru ditambahkan) menjadi sheet <code>&lt;kode&gt;_' + next + '</code> dengan checklist kosong. Setelah itu tahun ' + d.latestYear + ' otomatis menjadi arsip.</p>' +
      btnHtml('btn-tambah-tahun', ic('kelola', 15) + ' Tambah Tahun ' + next, 'tambahTahunUI()');
  } else {
    tahun += '<p class="desc" style="margin:0;">Penambahan tahun baru dilakukan oleh admin provinsi.</p>';
  }

  // Kartu Kecamatan
  var kec = '';
  if (!d.editable) {
    kec += '<p class="desc">Anda sedang melihat arsip tahun ' + d.year + '. Kecamatan baru hanya bisa ditambahkan pada tahun aktif (' + d.latestYear + ') dan otomatis ikut ke tahun-tahun berikutnya.</p>' +
      '<button class="btn" onclick="onYearChange(' + d.latestYear + ')">Buka tahun ' + d.latestYear + '</button>';
  } else {
    kec += '<p class="desc">Kecamatan baru ditambahkan di akhir daftar pada tahun ' + d.year + ' dan otomatis ikut disalin saat tahun baru dibuat.</p>';
    kec += '<div class="form-field"><label for="kelola-kab">Kabupaten/Kota</label>';
    if (isAdmin) {
      kec += '<select id="kelola-kab" class="field-select" onchange="onKelolaKabChange(this.value)"><option value="">Pilih Kabupaten/Kota</option>' +
        sortedByKode(d.kabupaten).map(function (kab) { return '<option value="' + kab.kode + '"' + (KELOLA_STATE.kode === kab.kode ? ' selected' : '') + '>' + esc(kab.nama) + '</option>'; }).join('') + '</select>';
    } else {
      var own = findKab(d.kode);
      kec += '<div class="form-static">' + esc(own ? own.nama : d.nama) + '</div>';
    }
    kec += '</div><div class="form-field"><label for="kelola-nama">Nama kecamatan baru</label>' +
      '<input id="kelola-nama" class="field-input" maxlength="60" placeholder="Contoh: Way Tenong" autocomplete="off">' +
      '<span class="form-hint">Tulis nama kecamatannya saja. Awalan “Kecamatan” dan akhiran “Dalam Angka ' + d.year + '” ditambahkan otomatis mengikuti format baris yang sudah ada.</span></div>' +
      btnHtml('btn-tambah-kec', ic('kelola', 15) + ' Tambah Kecamatan', 'tambahKecamatanUI()') +
      '<div id="kelola-result" class="kelola-result"></div><div id="kelola-kec-list" class="kelola-kec-list"></div>';
  }

  h += '<div class="grid g-2">' + card('Tahun Data', null, tahun) + card('Tambah Kecamatan', null, kec) + '</div>';
  setMain(h);

  var input = document.getElementById('kelola-nama');
  if (input) input.addEventListener('keydown', function (e) { if (e.key === 'Enter') tambahKecamatanUI(); });
  renderKelolaKecList();
}

function onKelolaKabChange(kode) {
  KELOLA_STATE.kode = kode || null;
  KELOLA_STATE.baruRow = null;
  var res = document.getElementById('kelola-result');
  if (res) res.innerHTML = '';
  renderKelolaKecList();
}

function renderKelolaKecList() {
  var box = document.getElementById('kelola-kec-list');
  if (!box) return;
  var kab = KELOLA_STATE.kode ? findKab(KELOLA_STATE.kode) : null;
  if (!kab) { box.innerHTML = ''; box.style.display = 'none'; return; }
  box.style.display = '';
  box.innerHTML = '<div class="sub-label">Kecamatan terdaftar di ' + esc(kab.nama) + ' (' + fmt(kab.kecamatan.length) + ')</div><ol>' +
    kab.kecamatan.map(function (k) {
      return '<li' + (k.row === KELOLA_STATE.baruRow ? ' class="baru"' : '') + '>' + esc(k.nama) + (k.row === KELOLA_STATE.baruRow ? ' (baru)' : '') + '</li>';
    }).join('') + '</ol>';
}

function tambahKecamatanUI() {
  var d = STATE.data;
  var kode = KELOLA_STATE.kode;
  if (!kode) { showToast('Pilih kabupaten/kota terlebih dahulu.', 'error'); return; }
  var input = document.getElementById('kelola-nama');
  var nama = input.value.replace(/\s+/g, ' ').trim();
  if (!nama) { showToast('Isi nama kecamatan terlebih dahulu.', 'error'); input.focus(); return; }
  var kab = findKab(kode);
  var ok = confirm('Tambahkan kecamatan "' + nama + '" ke ' + (kab ? kab.nama : kode) + ' untuk tahun ' + d.year + '?\n\n' +
    'Pastikan penulisan nama sudah benar. Nama kecamatan dipakai sebagai kunci komentar, jadi sebaiknya tidak diubah lagi setelah ada diskusi.');
  if (!ok) return;
  var btn = document.getElementById('btn-tambah-kec');
  setBtnLoading(btn, true);
  google.script.run
    .withSuccessHandler(function (res) {
      setBtnLoading(btn, false);
      replaceKab(res.kab);
      KELOLA_STATE.baruRow = res.row;
      input.value = '';
      var box = document.getElementById('kelola-result');
      if (box) {
        box.innerHTML = '<span><b>' + esc(res.nama) + '</b> berhasil ditambahkan ke ' + esc(res.kab.nama) + '.</span>' +
          '<button class="link-btn" onclick="openKab(\'' + res.kab.kode + '\',' + res.row + ')">Buka checklist ' + ic('arrow', 14) + '</button>';
      }
      renderKelolaKecList();
      renderSidebar(currentSidebarFilter());
      showToast('Kecamatan berhasil ditambahkan.', 'success');
    })
    .withFailureHandler(function (err) { setBtnLoading(btn, false); actionError(err); })
    .tambahKecamatan(STATE.auth.token, kode, nama);
}

function tambahTahunUI() {
  var d = STATE.data;
  var next = d.latestYear + 1;
  var ok = confirm('Buat data tahun ' + next + '?\n\n' +
    '• Semua sheet kab/kota tahun ' + d.latestYear + ' akan disalin menjadi sheet tahun ' + next + ' dengan checklist kosong.\n' +
    '• Setelah itu data tahun ' + d.latestYear + ' menjadi ARSIP dan tidak bisa diubah lagi dari dashboard.\n\n' +
    'Proses ini bisa memakan waktu hingga 1 menit. Lanjutkan?');
  if (!ok) return;
  var btn = document.getElementById('btn-tambah-tahun');
  setBtnLoading(btn, true);
  google.script.run
    .withSuccessHandler(function (res) {
      showToast('Tahun ' + res.year + ' berhasil dibuat (' + res.dibuat.length + ' sheet).', 'success');
      STATE.year = res.year;
      STATE.restore = { view: 'kelola', kab: KELOLA_STATE.kode };
      loadData();
    })
    .withFailureHandler(function (err) { setBtnLoading(btn, false); actionError(err); })
    .tambahTahun(STATE.auth.token);
}

init();
</script>
</body>
</html>
